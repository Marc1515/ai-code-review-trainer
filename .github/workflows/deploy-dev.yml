name: Deploy development

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy development
    runs-on: [self-hosted, ai-code-review-trainer]

    steps:
      - name: Deploy dev app
        run: |
          cd ~/apps/ai-code-review-trainer-dev
          git fetch origin
          git checkout dev
          git reset --hard origin/dev
          docker compose \
            --env-file .env.development \
            --env-file .env.traefik \
            -f docker-compose.dev.yml \
            -f docker-compose.dev.secure.yml \
            up -d --build --remove-orphans
          docker image prune -f
          docker builder prune -af --filter "until=24h"
